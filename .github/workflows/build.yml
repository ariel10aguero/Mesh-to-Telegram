name: Build MeshTelegramBridge

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller
        run: pyinstaller mesh_bridge_gui.spec -y

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y

      - name: Package Linux DEB
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#.}"
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then VERSION="0.0.${GITHUB_RUN_NUMBER}"; fi
          mkdir -p package-root/DEBIAN package-root/usr/bin package-root/usr/share/applications package-root/usr/share/icons/hicolor/256x256/apps release-assets
          cp dist/MeshTelegramBridge package-root/usr/bin/mesh-telegram-bridge
          chmod 755 package-root/usr/bin/mesh-telegram-bridge
          cp mesh-telegram.png package-root/usr/share/icons/hicolor/256x256/apps/mesh-telegram-bridge.png
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=MeshTelegramBridge' \
            'Comment=Meshtastic to Telegram bridge' \
            'Exec=/usr/bin/mesh-telegram-bridge' \
            'Icon=mesh-telegram-bridge' \
            'Terminal=false' \
            'Categories=Network;Chat;' \
            > package-root/usr/share/applications/mesh-telegram-bridge.desktop
          printf '%s\n' \
            'Package: mesh-telegram-bridge' \
            "Version: $VERSION" \
            'Section: net' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: MeshTelegramBridge contributors' \
            'Description: Meshtastic to Telegram bridge' \
            ' Desktop bridge between Meshtastic and Telegram.' \
            > package-root/DEBIAN/control
          dpkg-deb --build --root-owner-group package-root release-assets/MeshTelegramBridge-Linux.deb

      - name: Package Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          New-Item -ItemType Directory -Force wix-build | Out-Null
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v\.?([0-9]+(\.[0-9]+){0,2})$') {
            $version = $Matches[1]
            $parts = $version.Split('.')
            while ($parts.Count -lt 3) { $version += '.0'; $parts = $version.Split('.') }
          } else {
            $version = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="MeshTelegramBridge" Language="1033" Version="$version" Manufacturer="MeshTelegramBridge contributors" UpgradeCode="9D8B2E1F-5D1F-4D43-9EF8-B7B3C3D2B1A0">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" />
              <MediaTemplate EmbedCab="yes" />
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFilesFolder">
                  <Directory Id="INSTALLFOLDER" Name="MeshTelegramBridge">
                    <Component Id="MainExecutable" Guid="*">
                      <File Id="MeshTelegramBridgeExe" Source="dist\MeshTelegramBridge.exe" KeyPath="yes" />
                    </Component>
                  </Directory>
                </Directory>
              </Directory>
              <Feature Id="ProductFeature" Title="MeshTelegramBridge" Level="1">
                <ComponentRef Id="MainExecutable" />
              </Feature>
            </Product>
          </Wix>
          "@ | Set-Content -Encoding UTF8 package.wxs
          candle.exe package.wxs -o wix-build\package.wixobj
          light.exe wix-build\package.wixobj -pdbout wix-build\package.wixpdb -o release-assets\MeshTelegramBridge-Windows.msi
          Remove-Item package.wxs

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg-root release-assets
          cp -R dist/MeshTelegramBridge.app dmg-root/MeshTelegramBridge.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname MeshTelegramBridge -srcfolder dmg-root -ov -format UDZO release-assets/MeshTelegramBridge-macOS.dmg

      - name: Upload release asset for publishing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.os }}
          path: release-assets/*

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshTelegramBridge-package-${{ matrix.os }}
          path: release-assets/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshTelegramBridge-${{ matrix.os }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
